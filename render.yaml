# Render Blueprint — deploys the CodeGraph web app (apps/web/) as a Docker
# web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: codegraph
    runtime: docker
    # Explicit repo root. Render's dashboard has a "Root Directory" field that
    # overrides the blueprint default (empty = repo root). If someone types
    # "app" there — an easy typo for "apps" — the clone fails with
    #   Root directory "app" does not exist.
    # Pinning it here means a blueprint sync always wins.
    rootDir: .
    # Context MUST be the repo root, not apps/web: the image installs from the
    # root lockfile and traces imports into packages/*, both of which sit
    # outside apps/web. Pinning the context to the app directory builds an
    # image that cannot resolve the workspace (docs/design/SPIKES.md §1).
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    # Persistent disks require a paid instance type; Starter is the minimum.
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Public base URL the app advertises for itself. After the first deploy,
      # set this to your live Render URL (e.g. https://codegraph.onrender.com).
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # GitHub sign-in (optional). Unset = feature hidden, nothing else affected.
      # See DEPLOY.md "GitHub sign-in setup" for the OAuth App registration steps.
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: CG_SESSION_SECRET
        sync: false
      # Optional: restrict the whole app to your GitHub account (or a small
      # team) once sign-in above is configured. See DEPLOY.md "Locking the
      # whole app to your account".
      - key: CG_OWNER_GITHUB_LOGIN
        sync: false
    # The SQLite DB + WAL live here and MUST persist across deploys/restarts.
    disk:
      name: codegraph-data
      mountPath: /app/data
      sizeGB: 1
