# Render Blueprint — CodeGraph.
#
# Validated against Render's published schema (https://render.com/schema/render.yaml.json)
# with a real JSON-Schema validator, and that check earns its keep: it caught `value: false`
# being a YAML boolean where the schema wants string-or-number, which rejects the whole file.
# Render also rejects fields that are valid but unavailable on the plan — `maxShutdownDelaySeconds`
# came back as "max shutdown delay is not supported for free tier services" — so a schema pass
# is necessary and not sufficient. Both classes are recorded where they bit.
#
# THIS SERVICE DOES NOT BUILD. It pulls a prebuilt image; see the block below for why.
#
# Docs: https://render.com/docs/blueprint-spec


services:
  - type: web
    name: codegraph
    # ── What runs ────────────────────────────────────────────────────────────────────────
    # PULLS A PREBUILT IMAGE. It does not build, and that is the point.
    #
    # Six consecutive deploys failed here, none for a code reason. Every one was a build-input
    # problem on the platform — a stale Root Directory, a Dockerfile Path pointing at a moved
    # file, an external BuildKit frontend that could not re-resolve the dockerfile — and every
    # one was invisible to `docker build .` locally. A service that does not build cannot have
    # any of them: there is no dockerfilePath, no dockerContext and no rootDir below, because
    # those fields do not exist for this runtime.
    #
    # The image is published by .github/workflows/publish-image.yml on every push to main,
    # from the same CI that indexes two real repositories with it and gates peak memory at 85%
    # of the 512 MB budget. So what runs in production is bit-for-bit what CI verified — which
    # a rebuild-from-source service never guaranteed.
    #
    # Verified before switching to it: pulls ANONYMOUSLY (the package is public, so no
    # `image.creds` is needed), linux/amd64, boots at --memory=512m --cpus=0.5, /api/health ok,
    # worker started, and a full clone-and-index of github.com/octocat/Hello-World reached
    # `done` inside the container.
    #
    # `:latest` is what a deploy pulls. Render caches mutable tags, so when you need certainty
    # about which image is running, pin the commit instead:
    #   url: ghcr.io/archdex-art/codegraph:<40-char commit sha>
    runtime: image
    image:
      url: ghcr.io/archdex-art/codegraph:latest

    # ── Runtime shape ────────────────────────────────────────────────────────────────────
    # These MATCH THE LIVE SERVICE, verified against its dashboard on 2026-08-05. They used to
    # say `starter`/`oregon` with a 5 GB disk, which described a service that does not exist:
    # applying it would have been rejected (Free instances cannot have a disk) or would have
    # tried to create a second service, because a region cannot be changed in place.
    plan: free             # Free · 0.1 CPU · 512 MB. See the DATA LOSS note below.
    region: singapore      # Cannot be changed in place. Moving region means a new service.
    healthCheckPath: /api/health

    # OFF on the live service, and this file follows it rather than fighting it. With
    # auto-deploy off, merging to `main` does nothing until someone clicks Manual Deploy —
    # worth stating, because it is why a merged fix can look like it did not work.
    autoDeploy: false

    # THERE IS NO PERSISTENT DISK, BECAUSE FREE INSTANCES CANNOT HAVE ONE.
    #
    # `CG_DATA_DIR=/app/data` is therefore a directory INSIDE THE CONTAINER, and everything
    # this product persists lives there: codegraph.sqlite and its WAL, data/workspaces/<repoId>
    # (a full git clone per indexed repository), data/trash, and data/index-cache. All of it is
    # destroyed on every deploy, every restart, and every idle spin-down — a Free instance
    # stops after ~15 minutes without traffic. Indexed repositories, saved settings, editor
    # workspaces and sign-in sessions do not survive any of those.
    #
    # The app does not fail; it forgets. That is the worse failure mode, so it is recorded in
    # the file that describes the deployment rather than left to be discovered.
    #
    # TO FIX IT: upgrade the instance type to Starter, then add exactly this:
    #
    #     plan: starter
    #     numInstances: 1              # SQLite has one writer; never scale this service out
    #     maxShutdownDelaySeconds: 120 # REJECTED on free: "max shutdown delay is not supported
    #                                  # for free tier services". It matters once you are paid:
    #                                  # the default grace is 30s, the worker's shutdown policy
    #                                  # is to FINISH the job it holds, and a first index takes
    #                                  # longer than that — so the default hard-kills mid-index
    #                                  # on every redeploy, which is how a job row gets stranded.
    #     disk:
    #       name: codegraph-data
    #       mountPath: /app/data  # MUST equal the Dockerfile's ENV CG_DATA_DIR, or the writes
    #       sizeGB: 5             # miss the volume and the symptom is identical to no disk
    #
    # Clones dominate the space, and a disk can grow but never shrink.


    # Skip a rebuild for changes that cannot reach the image. Each of these is already
    # excluded by `.dockerignore`, so a build triggered by one of them is guaranteed to
    # produce a byte-identical image. Only `ignoredPaths` is set: anything NOT listed still
    # builds, so the failure mode of a wrong entry here is a wasted build, never a missed one.
    buildFilter:
      ignoredPaths:
        - docs/**
        - benchmarks/**
        - "**/*.md"

    # ── Environment ──────────────────────────────────────────────────────────────────────
    envVars:
      # Pinned so the platform and the image cannot disagree about the port. The image sets
      # `ENV PORT=4000` and Next's standalone server binds `process.env.PORT`; Render injects
      # its own PORT (10000 by default) and health-checks what it injected. Two sources of
      # truth for one number, resolved here in favour of the one the image already uses.
      - key: PORT
        value: 4000

      # The rate limiter derives the client identity from the Nth-from-the-RIGHT
      # X-Forwarded-For entry, because the leftmost is attacker-controlled (AUDIT F-PT-01).
      # Render puts exactly one proxy in front of a web service, so 1 is the correct count —
      # and stating it here is what keeps the limiter honest if that ever changes.
      - key: CG_TRUSTED_PROXY_HOPS
        value: 1

      # Local-folder indexing and server-side directory browsing. Off already, because
      # `config` defaults it off when NODE_ENV=production — but on a public instance this is
      # a filesystem-disclosure switch, and defence in depth costs one line. It must NEVER be
      # true here.
      - key: CG_ALLOW_LOCAL_ACCESS
        # Quoted: Render's schema types an env value as string-or-number, so an unquoted
        # YAML `false` is a boolean and the Blueprint validator rejects the whole file.
        value: "false"

      # Encrypts the GitHub session cookie (AES-256-GCM).
      #
      # `sync: false`, NOT `generateValue: true`, and the difference is destructive: the live
      # service already has a value set, and generating a new one on sync would silently
      # re-key every session cookie and sign every user out. `sync: false` leaves whatever the
      # dashboard holds untouched. For a NEW service, set it to any long random string — with
      # it unset, GitHub sign-in stays disabled with no error anywhere.
      - key: CG_SESSION_SECRET
        sync: false

      # ── Optional, prompted at Blueprint sync; leave blank to keep the feature off ──
      #
      # Base URL the app advertises for itself, used to build the GitHub OAuth redirect_uri.
      # Blank is FINE and is the recommended setting: the app falls back to the request's own
      # origin, which is already correct on Render. Set it only for a custom domain.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # GitHub sign-in. Both unset = the feature is hidden; nothing else is affected.
      # See apps/web/DEPLOY.md, "GitHub sign-in setup".
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      # Restrict the ENTIRE app — including the normally-anonymous public bucket — to one or
      # more GitHub logins. Requires the two variables above; fails closed without them.
      - key: CG_OWNER_GITHUB_LOGIN
        sync: false
      # HTTP Basic Auth over everything, as a blunter alternative to the owner lock.
      - key: CG_BASIC_AUTH_PASSWORD
        sync: false
