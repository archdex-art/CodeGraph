# Render Blueprint — CodeGraph.
#
# Validated against Render's published schema (https://render.com/schema/render.yaml.json):
# every field below exists in that schema and every enum value is one it accepts. That check
# is worth stating because the failure mode of this file is silent — Render reports "invalid
# blueprint" without naming the field, and a typo'd key is simply ignored.
#
# THE IMAGE IS NOT THE PROBLEM, AND WAS VERIFIED BEFORE THIS FILE WAS REWRITTEN.
# The image (root `Dockerfile`) was built and run locally against Render's exact constraints:
#   · builds clean for BOTH linux/arm64 and linux/amd64 (Render runs amd64; the lockfile
#     carries every linux-x64 optional binary — lightningcss, @next/swc, esbuild, oxide —
#     which is the failure recorded in docs/REVIEW_2026-07-29.md and it is genuinely fixed);
#   · runs under `--memory=512m --cpus=0.5` with the worker enabled, peak 128 MiB of 512;
#   · /api/health 200, a full index and an incremental re-index both reached `done`,
#     SQLite + WAL + index-cache all landed on the mounted /app/data.
# So a failing deploy is a SERVICE-SETTINGS problem, not a build problem. See the note on
# Root Directory below, which is the one thing this file cannot fix for you.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: codegraph
    runtime: docker

    # ── Build ────────────────────────────────────────────────────────────────────────────
    # Both values are the repo root, and that is the point. The context MUST be the root —
    # `npm ci` installs from the ROOT lockfile and Next's file tracer follows imports into
    # packages/*, both outside apps/web, so a context pinned to the app directory builds an
    # image that cannot resolve the workspace (docs/design/SPIKES.md §1). The Dockerfile
    # therefore lives at the root too, next to the lockfile it installs from.
    #
    # It used to live at apps/web/Dockerfile, and the split is what broke the deploy: these
    # two settings also exist as dashboard fields, each relative to something the UI does not
    # state, and the service was configured with the pair (`./Dockerfile`, `.`) while the file
    # was elsewhere. BuildKit answered
    #   failed to solve: failed to read dockerfile: open Dockerfile: no such file or directory
    # reproduced locally as `docker build -f Dockerfile .`, byte-identical to the deploy log.
    # With one directory for both, the settings cannot disagree — and the platform's own
    # default for `Dockerfile Path` is now the correct value.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    #
    # `rootDir` is deliberately ABSENT: omitted means the repo root, which is what both paths
    # above are relative to. Setting it to `.` (a previous attempt) changed nothing.
    #
    # AND THIS FILE MAY NOT BE READ AT ALL. Evidence from the failing deploy: it reported
    # `Root directory "app" does not exist` while this file declared `rootDir: .`, and the log
    # also said `It looks like we don't have access to your repo`. A Blueprint sync cannot be
    # happening under those conditions, so the dashboard is the source of truth for this
    # service and these values must match it by hand:
    #   Root Directory                  → EMPTY (not ".")
    #   Dockerfile Path                 → ./Dockerfile
    #   Docker Build Context Directory  → .
    #   Docker Command                  → EMPTY (the image's CMD starts the worker, then execs
    #                                     the web server; anything here silently disables the
    #                                     worker and jobs queue forever)
    # To make this file authoritative again, reconnect the GitHub App and create the Blueprint
    # from it, or recreate the service from the Blueprint — a fresh service has no stale field.

    # ── Runtime shape ────────────────────────────────────────────────────────────────────
    plan: starter          # Starter is the minimum that supports a persistent disk.
    region: oregon         # Do NOT change: a disk cannot move region, so this orphans the data.
    healthCheckPath: /api/health
    autoDeploy: true

    # SQLite on a local disk cannot be shared between instances, so this service is
    # single-instance BY CONSTRUCTION, not by default. Pinned here so that turning on
    # autoscaling later is a visible edit to this line rather than a silent second writer
    # against one database file (IDENTITY.md §1: "one container, one SQLite file").
    numInstances: 1

    # Render's default SIGTERM grace is 30s. The worker's shutdown policy is to FINISH the
    # job it is holding (apps/worker/src/main.ts), and a first index of a large repository
    # takes longer than that — so the default guarantees a periodic hard kill mid-index on
    # every redeploy, which is precisely how a job row gets stranded. 120s is above the
    # 90s clone timeout plus a typical index, and well under the 300s ceiling.
    maxShutdownDelaySeconds: 120

    # Skip a rebuild for changes that cannot reach the image. Each of these is already
    # excluded by `.dockerignore`, so a build triggered by one of them is guaranteed to
    # produce a byte-identical image. Only `ignoredPaths` is set: anything NOT listed still
    # builds, so the failure mode of a wrong entry here is a wasted build, never a missed one.
    buildFilter:
      ignoredPaths:
        - docs/**
        - benchmarks/**
        - "**/*.md"

    # ── Environment ──────────────────────────────────────────────────────────────────────
    envVars:
      # Pinned so the platform and the image cannot disagree about the port. The image sets
      # `ENV PORT=4000` and Next's standalone server binds `process.env.PORT`; Render injects
      # its own PORT (10000 by default) and health-checks what it injected. Two sources of
      # truth for one number, resolved here in favour of the one the image already uses.
      - key: PORT
        value: 4000

      # The rate limiter derives the client identity from the Nth-from-the-RIGHT
      # X-Forwarded-For entry, because the leftmost is attacker-controlled (AUDIT F-PT-01).
      # Render puts exactly one proxy in front of a web service, so 1 is the correct count —
      # and stating it here is what keeps the limiter honest if that ever changes.
      - key: CG_TRUSTED_PROXY_HOPS
        value: 1

      # Local-folder indexing and server-side directory browsing. Off already, because
      # `config` defaults it off when NODE_ENV=production — but on a public instance this is
      # a filesystem-disclosure switch, and defence in depth costs one line. It must NEVER be
      # true here.
      - key: CG_ALLOW_LOCAL_ACCESS
        # Quoted: Render's schema types an env value as string-or-number, so an unquoted
        # YAML `false` is a boolean and the Blueprint validator rejects the whole file.
        value: "false"

      # Encrypts the GitHub session cookie (AES-256-GCM). Render generates a strong random
      # value on first sync; previously this was `sync: false`, so an operator who skipped the
      # prompt got a deployment where sign-in silently stayed disabled with no error anywhere.
      # Rotating it signs everyone out, which is the intended emergency action.
      - key: CG_SESSION_SECRET
        generateValue: true

      # ── Optional, prompted at Blueprint sync; leave blank to keep the feature off ──
      #
      # Base URL the app advertises for itself, used to build the GitHub OAuth redirect_uri.
      # Blank is FINE and is the recommended setting: the app falls back to the request's own
      # origin, which is already correct on Render. Set it only for a custom domain.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # GitHub sign-in. Both unset = the feature is hidden; nothing else is affected.
      # See apps/web/DEPLOY.md, "GitHub sign-in setup".
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      # Restrict the ENTIRE app — including the normally-anonymous public bucket — to one or
      # more GitHub logins. Requires the two variables above; fails closed without them.
      - key: CG_OWNER_GITHUB_LOGIN
        sync: false
      # HTTP Basic Auth over everything, as a blunter alternative to the owner lock.
      - key: CG_BASIC_AUTH_PASSWORD
        sync: false

    # ── Persistent state ─────────────────────────────────────────────────────────────────
    # `name` and `mountPath` MUST NOT change: mountPath is matched by CG_DATA_DIR in the
    # Dockerfile, and renaming the disk destroys the existing one.
    #
    # This directory holds everything that is not in the image and cannot be regenerated
    # cheaply: codegraph.sqlite plus its WAL, data/workspaces/<repoId> (a FULL git clone per
    # indexed repository — the dominant consumer, with no per-repo quota), data/trash, and
    # data/index-cache (one gzipped manifest per workspace, ~0.15–1 MB).
    #
    # Sized 5 GB rather than 1 GB on the arithmetic: run rows were measured at ~100 KB each
    # and, with edit-triggered re-indexing, an actively edited repo can produce hundreds per
    # hour — retention now bounds that, but the clones do not shrink and three or four
    # mid-size repositories were already enough to fill 1 GB. The failure mode being bought
    # off is ENOSPC mid-index, which lands on the same volume as the database. A disk can be
    # grown later but NEVER shrunk, so this is the one number worth over-provisioning.
    disk:
      name: codegraph-data
      mountPath: /app/data
      sizeGB: 5
