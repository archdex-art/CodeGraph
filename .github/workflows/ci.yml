name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test & Build (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # `npm ci` at the workspace root, never `npm install`: a cold install
      # resolves metadata for ~500 packages and did not finish in several
      # minutes during the P1 spike, while `npm ci` against the committed root
      # lockfile takes ~23s (docs/design/SPIKES.md §1).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # This gate was DEAD, not passing. `no-console` was configured as
      # `["error", { allow: [] }]`, which ESLint 9 rejects (`allow` needs >= 1
      # item), so eslint exited 2 before linting a file — and CI never ran it,
      # so nothing surfaced the crash. Both halves were needed to hide it, and
      # 17 react-hooks@7 violations accumulated behind it.
      #
      # Ratcheted the same way as the layering gate above: --max-warnings is
      # pinned to the exact current total (22) in apps/web's lint script, with
      # the known sites downgraded to warnings in eslint.config.mjs and
      # inventoried in docs/LINT_DEBT.md. A violation in a NEW file is a hard
      # error; one more warning anywhere pushes the count past the pin. Both
      # directions verified to fail before this was committed.
      - name: Lint
        run: npm run lint

      # Layering gate (HLD §6.1). Runs with --ignore-known: the four
      # pre-existing cycles in apps/web are baselined in
      # .dependency-cruiser-known-violations.json and documented as P1-1 in
      # docs/REVIEW_2026-07-29.md, while any NEW cycle or layering violation
      # fails here. Verified to fail on a newly introduced cycle.
      - name: Layering + cycle check
        run: npm run depcruise

      # Property-access bans that dependency-cruiser structurally cannot see:
      # `process.env` outside @codegraph/config (LLD §10.3) and `console.*`
      # outside @codegraph/observability (HLD §14). Exclusions are stated and
      # justified in the script itself.
      - name: Module boundary check
        run: python3 scripts/check_boundaries.py

      # Every workspace must declare `typecheck` and `test`, and any workspace
      # with a vitest config must appear in `test.projects`. Both root scripts
      # skip silently otherwise: `--workspaces --if-present` passes over a
      # missing script, and `vitest run` collects from `test.projects` rather
      # than the workspace list.
      #
      # This is not theoretical. `apps/cli`, `packages/sandbox`, and
      # `packages/remediate-engine` were created, imported, and green while
      # entirely unchecked — a deliberate type error in apps/cli produced 0
      # errors. Adding the script surfaced 14 real ones, including `--rule`
      # with no value silently binding undefined and running every fixer.
      - name: Workspace gate coverage
        run: python3 scripts/check_workspace_scripts.py

      - name: Unit tests
        run: npm run test

      - name: Build (Next.js production build)
        run: npm run build

      # The standalone entrypoint is nested under the workspace path once
      # `outputFileTracingRoot` is the monorepo root. Asserting the file exists
      # is cheap and catches the layout regression here rather than in a
      # crash-looping container (docs/design/SPIKES.md §1).
      - name: Assert standalone entrypoint location
        run: test -f apps/web/.next/standalone/apps/web/server.js

  docker-smoke-test:
    name: Docker build + adversarial smoke test
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4

      # Context is the repo root; the Dockerfile lives in the app it builds.
      - name: Build production image
        run: docker build -t codegraph-ci:${{ github.sha }} .

      - name: Run under Render-equivalent constraints (512MB, 0.5 CPU, root-owned disk mount)
        run: |
          docker run -d --name ci-smoke -p 4000:4000 \
            --memory=512m --memory-swap=512m --cpus=0.5 \
            --tmpfs /app/data:uid=0,gid=0,mode=0755 \
            codegraph-ci:${{ github.sha }}
          sleep 3

      - name: Health check
        run: |
          curl -sf http://localhost:4000/api/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Index real repos end-to-end and confirm nothing hangs, errors, or crashes the server
        run: |
          set -e
          index_and_wait() {
            local repo_url="$1"
            echo "=== indexing $repo_url ==="
            RESP=$(curl -sf -X POST http://localhost:4000/api/index \
              -H "Content-Type: application/json" \
              -d "{\"repoUrl\":\"$repo_url\"}")
            JOB_ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['jobId'])")
            for i in $(seq 1 40); do
              STATUS=$(curl -sf "http://localhost:4000/api/jobs/$JOB_ID")
              echo "poll $i: $STATUS"
              if echo "$STATUS" | grep -q '"status":"done"'; then return 0; fi
              if echo "$STATUS" | grep -q '"status":"error"'; then echo "indexing errored"; return 1; fi
              if ! docker ps --filter name=ci-smoke --format '{{.Status}}' | grep -q Up; then
                echo "container died mid-index"; docker logs ci-smoke; return 1
              fi
              sleep 1
            done
            echo "timed out waiting for $repo_url to finish indexing"; return 1
          }
          # Hello-World has no real code files — fast sanity check that the
          # pipeline runs at all, but would NOT have caught the WASM-memory
          # OOM incident (docs/postmortems/2026-07-10-tree-sitter-oom.md).
          index_and_wait "https://github.com/octocat/Hello-World"
          # express is a completely ordinary repo that reliably OOM-killed
          # the container before that fix — this is the regression guard.
          index_and_wait "https://github.com/expressjs/express"
          curl -sf http://localhost:4000/api/health | grep -q '"status":"ok"' \
            || { echo "server unhealthy after indexing (residual crash?)"; exit 1; }

      # Report peak memory as a NUMBER, and gate on headroom rather than on death.
      #
      # The step above already enforces the 512MB budget, but only as a cliff: the container
      # OOM-dies and the poll notices. That catches a catastrophe and is blind to erosion —
      # a change taking the peak from 342 MiB to 500 MiB passes silently, and the next small
      # change is the one that looks guilty.
      #
      # This exists because a measured optimisation was rejected on exactly this budget
      # (holding a `ts.Program` for reuse: 67% faster warm indexes, ~500 MB of RETAINED heap —
      # see docs/design/PLAN.md). A number every run is what makes that tradeoff checkable by
      # someone who was not there for the measurement.
      - name: Peak memory headroom
        run: |
          set -e
          # cgroup v2 on GitHub's Ubuntu runners; v1 path kept for a self-hosted runner.
          PEAK=$(docker exec ci-smoke cat /sys/fs/cgroup/memory.peak 2>/dev/null \
              || docker exec ci-smoke cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes)
          LIMIT=$(docker exec ci-smoke cat /sys/fs/cgroup/memory.max 2>/dev/null \
              || docker exec ci-smoke cat /sys/fs/cgroup/memory/memory.limit_in_bytes)
          python3 - "$PEAK" "$LIMIT" <<'EOF'
          import sys
          peak, limit = int(sys.argv[1]), int(sys.argv[2])
          pct = peak / limit * 100
          mib = lambda b: b / 1024 / 1024
          print(f"peak {mib(peak):.1f} MiB of {mib(limit):.0f} MiB limit "
                f"({pct:.1f}%, {mib(limit - peak):.1f} MiB headroom)")
          # 85%: the observed peak indexing express is ~67%, so this trips on a real regression
          # while tolerating run-to-run variation. Deliberately below 100 — a gate that fires
          # only at the cliff is the OOM check above, which already exists.
          if pct > 85:
              print(f"FAIL: peak memory {pct:.1f}% of the 512MB budget exceeds the 85% gate.")
              print("The budget is the product constraint (ADR-001), not a CI setting.")
              sys.exit(1)
          EOF

      # Assert the database landed on the MOUNTED path, not somewhere
      # container-ephemeral.
      #
      # This exists because the monorepo move broke it and nothing above
      # noticed: `dataDir` defaults to `cwd/data`, Next's standalone server
      # chdirs to the directory holding server.js, and that directory moved from
      # /app to /app/apps/web. Indexing still worked, health stayed green, and
      # every restart would have silently discarded all persisted state because
      # the writes never reached the volume. A smoke test that only checks
      # "does it work right now" cannot see that; this can.
      - name: Assert persisted state is on the mounted data dir
        run: |
          set -e
          docker exec ci-smoke sh -c 'test -s /app/data/codegraph.sqlite' \
            || { echo "FAIL: /app/data/codegraph.sqlite missing or empty — the data dir is not the mount point"; \
                 echo "server cwd: $(docker exec ci-smoke readlink /proc/1/cwd)"; \
                 docker exec ci-smoke sh -c 'find / -name "codegraph.sqlite" -not -path "/proc/*" 2>/dev/null'; \
                 exit 1; }
          # And the schema is actually initialised there, not just an empty file
          # that opening a connection would create on its own.
          docker exec ci-smoke node -e "
            const { DatabaseSync } = process.getBuiltinModule('node:sqlite');
            const db = new DatabaseSync('/app/data/codegraph.sqlite');
            const versions = db.prepare('SELECT version FROM schema_migrations ORDER BY version').all().map(r => r.version);
            const repos = db.prepare('SELECT COUNT(*) c FROM repos').get().c;
            console.log('migrations:', versions.join(','), '| repos:', repos);
            if (versions.length === 0) { console.error('FAIL: no migrations recorded'); process.exit(1); }
            if (repos < 2) { console.error('FAIL: indexed repos did not persist here'); process.exit(1); }
          "

      - name: Dump logs on failure
        if: failure()
        run: docker logs ci-smoke || true

  desktop:
    name: Desktop (Electron app)
    runs-on: ubuntu-latest
    # apps/desktop (moved from desktop/ per LLD §13) is now a root workspace
    # member, so it installs from the root lockfile rather than its own. That
    # move is what fixed C6's original finding: the standalone desktop
    # package-lock.json had never been in sync with its package.json
    # (esbuild@0.28.1 vs ^0.20.1), so `npm ci` failed from the commit that
    # introduced it. There is now one lockfile and it cannot drift.
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # No ELECTRON_SKIP_BINARY_DOWNLOAD: the e2e step below launches a real
      # Electron process, so the ~90MB binary is now load-bearing rather than
      # dead weight.
      - name: Install dependencies
        run: npm ci
        working-directory: .

      # Widened past tsconfig.json's emit scope to also cover e2e/ and
      # scripts/ — see the comment in apps/desktop/tsconfig.typecheck.json.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # tsc emit + the esbuild preload bundle. Cheap, and it is the only thing
      # that exercises the preload contextBridge build at all.
      - name: Build (tsc + preload bundle)
        run: npm run build

      # The e2e suite launches dist/src/main/index.js, which spawns the real
      # Next standalone server from build/standalone/apps/web/server.js. That
      # tree does not exist until apps/web is built and build:orchestrate has
      # assembled it, so both are prerequisites, in this order.
      - name: Build web standalone (e2e prerequisite)
        run: npm run build --workspace @codegraph/web
        working-directory: .

      # Also the gate that fails the build if operator runtime state (SQLite
      # database, cloned repositories under apps/web/data/) reached the bundle.
      # Those paths are gitignored, so CI cannot reproduce the leak — this runs
      # here to keep the check itself honest, not because CI is where it fires.
      - name: Assemble Electron bundle
        run: npm run build:orchestrate

      # xvfb-run supplies the display Electron needs on a headless runner.
      # playwright.config.ts pins retries to 0 on purpose: this suite boots a
      # real server, so a retry would hide a boot/health-check race behind a
      # green tick.
      - name: E2E (Playwright + Electron)
        run: xvfb-run -a npx playwright test e2e/smoke.test.ts

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
