name: CodeGraph

# Pull requests only. The gate's whole premise is "fail a change on findings, not on a score" —
# there is no change to judge on a push to main, and the alerts for main come from the PR that
# introduced them.
on:
  pull_request:

permissions:
  contents: read
  # Uploading SARIF to code scanning.
  security-events: write
  # The sticky summary comment below.
  pull-requests: write

# One run per PR. A force-push while the previous run is still going would otherwise race two
# jobs onto the same sticky comment, and the loser's numbers win.
concurrency:
  group: codegraph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Findings gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: codegraph
        # `./` — this repository dogfoods its own composite action, so a change to `action.yml`
        # is exercised by the PR that makes it rather than after it merges.
        uses: ./
        # The comment below is the point of this workflow and it must be posted even when the
        # gate fires. The job's own status still comes from this step.
        continue-on-error: true
        with:
          path: "."
          fail-on: high
          sarif: codegraph.sarif
          json: codegraph-summary.json

      - name: Sticky summary comment
        # `always()`: a failed gate is the run whose comment matters most.
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');

            // A hidden marker, not a title match. The comment body is entirely
            // score-dependent, so any content-based lookup breaks the moment the numbers
            // change and every push leaves another comment behind — which is the failure
            // mode this exists to prevent.
            const MARKER = '<!-- codegraph-summary -->';
            const file = 'codegraph-summary.json';

            let body;
            if (!fs.existsSync(file)) {
              // Say so rather than staying silent: a missing summary means the CLI crashed,
              // and a PR whose gate silently stopped running is worse than one it failed.
              body = `${MARKER}\n### CodeGraph\n\n:warning: The gate did not produce a summary — it crashed before writing \`${file}\`. See the job log.`;
            } else {
              const s = JSON.parse(fs.readFileSync(file, 'utf8'));
              const verdict = s.passed
                ? `:white_check_mark: **Pass** — no unaccepted findings at or above \`${s.failOn}\` confidence.`
                : `:x: **Fail** — ${s.gatingCount} unaccepted finding(s) at or above \`${s.failOn}\` confidence.`;

              const lines = [
                MARKER,
                '### CodeGraph',
                '',
                verdict,
                '',
                `| Health | Active | Accepted | high | medium | low |`,
                `|---|---|---|---|---|---|`,
                `| **${s.score}**/100 | ${s.active} | ${s.accepted}${s.baselineFile ? ` (${s.acceptedByBaseline} via \`${s.baselineFile}\`)` : ''} | ${s.tiers.high} | ${s.tiers.medium} | ${s.tiers.low} |`,
              ];

              if (s.rules?.length) {
                lines.push('', '<details><summary>Top rules</summary>', '', '| Rule | Count | Tier |', '|---|---|---|');
                for (const r of s.rules.slice(0, 5)) {
                  lines.push(`| \`${r.rule}\` | ${r.count}${r.suppressed ? ` (${r.suppressed} accepted)` : ''} | ${r.tier} |`);
                }
                lines.push('', '</details>');
              }

              if (!s.passed) {
                // Five, with evidence. A wall of findings is a wall nobody reads; the full
                // set is in code scanning and in the JSON artifact.
                lines.push('', '**Gating findings**', '');
                for (const f of s.gating.slice(0, 5)) {
                  const at = `${f.file}:${f.line}`;
                  lines.push(`- \`${at}\` — \`${f.rule}\` _(${f.tier})_`);
                  lines.push(`  > ${f.evidence ?? f.title}`);
                }
                if (s.gatingCount > 5) lines.push('', `_… and ${s.gatingCount - 5} more._`);
                lines.push(
                  '',
                  'Fix them, add `codegraph-ignore` with a reason, or run `codegraph baseline` to accept today\'s.',
                );
              }

              body = lines.join('\n');
            }

            // `listComments` is the issue-comment list; a PR is an issue for this API. Paged
            // because a long-running PR passes 100 comments and the marker would then be on
            // a page nobody looked at, producing a duplicate on every push after that.
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const mine = existing.find((c) => c.body?.includes(MARKER));

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload the gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegraph
          path: |
            codegraph.sarif
            codegraph-summary.json
          if-no-files-found: warn

      # The verdict, restored after `continue-on-error` let the comment run.
      - name: Gate verdict
        if: steps.codegraph.outcome == 'failure'
        run: exit 1
