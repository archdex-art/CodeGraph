name: CodeGraph
description: >-
  Gate a pull request on unaccepted findings — not on a score — and upload the results to GitHub
  code scanning as SARIF.
author: CodeGraph

branding:
  icon: git-merge
  color: purple

# Composite rather than a Docker action. A Docker action would build (or pull) an image on every
# run for a tool whose entire runtime is Node plus this repository's own workspaces; composite
# reuses the runner's Node and the `npm ci` cache, which is the difference between ~20s and a
# multi-minute image step for identical work.
inputs:
  path:
    description: Directory to analyse, relative to the workspace.
    required: false
    default: "."
  fail-on:
    description: Confidence tier that fails the build — high, medium or low.
    required: false
    default: high
  sarif:
    description: Where the SARIF 2.1.0 log is written.
    required: false
    default: codegraph.sarif
  json:
    description: >-
      Where the JSON summary is written. This is what a PR comment is built from; the workflow in
      this repository reads it with actions/github-script.
    required: false
    default: codegraph-summary.json
  baseline:
    description: Accepted findings, relative to the analysed directory.
    required: false
    default: .codegraph-baseline.json
  upload-sarif:
    description: >-
      Upload to code scanning. Requires `security-events: write`, which a fork PR does not get —
      set this to false there rather than letting the upload fail the job.
    required: false
    default: "true"

outputs:
  score:
    description: Health Score of the analysed tree (0-100).
    value: ${{ steps.run.outputs.score }}
  passed:
    description: "true when the gate found nothing, false when it fired."
    value: ${{ steps.run.outputs.passed }}
  gating-count:
    description: Unaccepted findings at or above `fail-on`.
    value: ${{ steps.run.outputs.gating-count }}
  sarif:
    description: Path of the written SARIF log.
    value: ${{ steps.run.outputs.sarif }}
  json:
    description: Path of the written JSON summary.
    value: ${{ steps.run.outputs.json }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: ${{ github.action_path }}/package-lock.json

    # `npm ci` at the action's own root, never in the caller's workspace: the caller is the
    # repository being analysed and it has its own lockfile, its own dependencies, and no
    # business gaining CodeGraph's. Same reasoning as CI's root-lockfile install.
    #
    # `--ignore-scripts` because no dependency in this tree needs one — the parsers are WASM
    # (`web-tree-sitter`, `tree-sitter-wasms`) and SQLite is `node:sqlite`, so there is nothing
    # to compile. It stays off so that analysing a repository never executes a lifecycle script.
    - name: Install CodeGraph
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts

    # `continue-on-error`, not `||  true`. The gate's verdict IS the exit code, and it has to
    # survive to the last step of this action — but the SARIF upload and the PR comment must
    # still run when it fires, which is exactly the run where a reviewer needs them.
    - name: Run the gate
      id: run
      shell: bash
      continue-on-error: true
      env:
        CG_PATH: ${{ inputs.path }}
        CG_FAIL_ON: ${{ inputs.fail-on }}
        CG_SARIF: ${{ inputs.sarif }}
        CG_JSON: ${{ inputs.json }}
        CG_BASELINE: ${{ inputs.baseline }}
        CG_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -o pipefail
        # Absolute, because the CLI resolves --sarif/--json against ITS cwd (the action's
        # checkout) while the caller reads them from the workspace.
        sarif="$GITHUB_WORKSPACE/$CG_SARIF"
        json="$GITHUB_WORKSPACE/$CG_JSON"

        node "$CG_ACTION_PATH/apps/cli/bin.mjs" ci "$GITHUB_WORKSPACE/$CG_PATH" \
          --fail-on "$CG_FAIL_ON" \
          --baseline "$CG_BASELINE" \
          --sarif "$sarif" \
          --json "$json" | tee "$RUNNER_TEMP/codegraph.log"
        status=${PIPESTATUS[0]}

        # Guarded, because a crashed CLI writes no summary and an unguarded `require` would
        # then fail THIS step — replacing "the tool broke" with a bash error about a missing
        # module, and leaving `status` unset for the verdict step to choke on.
        if [ -s "$json" ]; then
          node -e '
            const s = require(process.argv[1]);
            const out = [`score=${s.score}`, `passed=${s.passed}`, `gating-count=${s.gatingCount}`];
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          ' "$json"
        else
          echo "::error title=CodeGraph::the gate wrote no summary at $json — it crashed."
          # Never 0: a missing summary must not read as a pass.
          if [ "$status" = "0" ]; then status=1; fi
        fi

        {
          echo "sarif=$CG_SARIF"
          echo "json=$CG_JSON"
          echo "status=$status"
        } >> "$GITHUB_OUTPUT"

        # The terminal summary, verbatim, in the run's own summary page — so the numbers are
        # readable without expanding a log group.
        {
          echo '## CodeGraph'
          echo '```'
          # Strip ANSI: the CLI colours for a terminal, and GitHub renders the escapes literally.
          sed -e $'s/\x1b\\[[0-9;]*m//g' "$RUNNER_TEMP/codegraph.log"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF to code scanning
      # `always()`: uploading only on a pass would mean the alerts appear exactly when there is
      # nothing to look at. `hashFiles` guards the case where the CLI itself crashed and wrote
      # nothing, which would otherwise fail the upload with a confusing "file not found".
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif) != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: codegraph

    # The verdict, restored. Everything above had to run regardless of it; this is the step whose
    # exit code the caller's job actually reads.
    - name: Gate verdict
      shell: bash
      env:
        CG_STATUS: ${{ steps.run.outputs.status }}
        CG_FAIL_ON: ${{ inputs.fail-on }}
        CG_GATING: ${{ steps.run.outputs.gating-count }}
      run: |
        if [ "$CG_STATUS" = "0" ]; then exit 0; fi
        # 1 is the gate firing; anything else is the CLI refusing to run (exit 2 is a usage
        # error, e.g. a `path` that does not exist). Reporting a crash as "N findings" with N
        # empty is how a broken invocation gets read as a legitimate failure and ignored.
        if [ "$CG_STATUS" = "1" ]; then
          echo "::error title=CodeGraph gate::$CG_GATING unaccepted finding(s) at or above $CG_FAIL_ON confidence."
        else
          echo "::error title=CodeGraph::the gate did not run (exit $CG_STATUS). See the log above."
        fi
        exit "$CG_STATUS"
