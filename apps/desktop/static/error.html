<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>CodeGraph</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 120% at 50% 0%, #16161d 0%, #0b0b0f 60%);
        color: #e7e7ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        text-align: center;
        max-width: 460px;
        padding: 40px 32px;
      }
      .badge {
        width: 56px; height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.35);
        font-size: 28px;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; }
      p { font-size: 14px; line-height: 1.6; color: #a1a1b3; margin: 0 0 28px; }
      .actions { display: flex; gap: 12px; justify-content: center; }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 20px;
        border-radius: 9px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.15s, border-color 0.15s;
      }
      .primary { background: #6366f1; color: #fff; }
      .primary:hover { background: #545be8; }
      .primary:disabled { opacity: 0.6; cursor: default; }
      .ghost { background: transparent; color: #c7c7d6; border-color: #2a2a35; }
      .ghost:hover { border-color: #3d3d4d; }
      .status { margin-top: 18px; font-size: 12px; color: #6f6f82; min-height: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">&#9888;</div>
      <h1>CodeGraph couldn&rsquo;t start</h1>
      <p>The local engine failed to launch after several attempts. This is usually temporary &mdash; try again, or quit and relaunch the app.</p>
      <div class="actions">
        <button class="primary" id="retry">Try again</button>
        <button class="ghost" id="quit">Quit</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    <script>
      const retryBtn = document.getElementById("retry");
      const quitBtn = document.getElementById("quit");
      const status = document.getElementById("status");
      const api = window.desktop && window.desktop.app;

      retryBtn.addEventListener("click", async () => {
        if (!api) { status.textContent = "Restart unavailable."; return; }
        retryBtn.disabled = true;
        status.textContent = "Restarting engine\u2026";
        const res = await api.retry();
        if (res && res.success === false) {
          retryBtn.disabled = false;
          status.textContent = "Retry failed. Please quit and relaunch.";
        }
      });

      quitBtn.addEventListener("click", () => api && api.quit());
    </script>
  </body>
</html>
